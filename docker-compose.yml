services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_cockpit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgres}@db:5432/finance_cockpit
      K3_BASE_URL: ${K3_BASE_URL}
      K3_ACCT_ID: ${K3_ACCT_ID}
      K3_USERNAME: ${K3_USERNAME}
      K3_PASSWORD: ${K3_PASSWORD}
      WECOM_CORP_ID: ${WECOM_CORP_ID}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID}
      WECOM_SECRET: ${WECOM_SECRET}
      WECOM_REDIRECT_URI: ${WECOM_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ENABLE_SCHEDULER: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
